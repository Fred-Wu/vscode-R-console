[package]
name = "R_CONSOLE_HOST"
version = "0.2.3"
edition = "2021"

[[bin]]
name = "R_CONSOLE_HOST"
path = "src/main.rs"

[dependencies]
libc = "0.2"
libloading = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
