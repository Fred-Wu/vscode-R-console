name: Release VSIX
run-name: Release ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish the built VSIX packages to the VS Code Marketplace
        type: boolean
        default: false
      publish_open_vsx:
        description: Publish the built VSIX packages to the Open VSX Registry
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: darwin-x64
            rust_target: x86_64-apple-darwin
          - os: macos-15
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            target: win32-x64
            rust_target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: win32-arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore sidecar from previous release
        id: restore-sidecar
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          restored=false
          trap 'echo "restored=${restored}" >> "$GITHUB_OUTPUT"' EXIT

          if ! command -v gh >/dev/null || ! command -v unzip >/dev/null; then
            echo "gh or unzip is unavailable; building sidecar."
            exit 0
          fi

          git fetch --force --tags --quiet

          current_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            current_tag=""
          fi
          previous_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 30 --json tagName --jq '.[].tagName' | awk -v current="${current_tag}" '$0 != current { print; exit }')"
          if [[ -z "${previous_tag}" ]]; then
            echo "No previous published release found; building sidecar."
            exit 0
          fi

          sidecar_inputs=(sidecar/pty-host scripts/build-sidecar.js scripts/sidecar-targets.js)
          if [[ "${TARGET}" == win32-* ]]; then
            sidecar_inputs+=(images/Rlogo.ico)
          fi
          if ! git diff --quiet "${previous_tag}" HEAD -- "${sidecar_inputs[@]}"; then
            echo "Sidecar build inputs changed; building sidecar."
            exit 0
          fi

          rm -rf .restore-sidecar
          mkdir -p .restore-sidecar bundled/bin
          if ! gh release download "${previous_tag}" --pattern "*-${TARGET}.vsix" --dir .restore-sidecar --clobber; then
            echo "Previous release ${previous_tag} has no VSIX for ${TARGET}; building sidecar."
            exit 0
          fi

          vsix="$(find .restore-sidecar -type f -name "*-${TARGET}.vsix" | head -n 1)"
          executable="R_CONSOLE_HOST"
          if [[ "${TARGET}" == win32-* ]]; then
            executable="R_CONSOLE_HOST.exe"
          fi

          if [[ -z "${vsix}" ]] || ! unzip -p "${vsix}" "extension/bundled/bin/${executable}" > "bundled/bin/${executable}"; then
            rm -f "bundled/bin/${executable}"
            echo "Could not extract ${executable} from ${previous_tag} VSIX; building sidecar."
            exit 0
          fi
          if [[ "${executable}" != *.exe ]]; then
            chmod 755 "bundled/bin/${executable}"
          fi

          echo "Restored bundled/bin/${executable} from ${previous_tag}/$(basename "${vsix}")."
          restored=true

      - name: Setup Rust
        if: steps.restore-sidecar.outputs.restored != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: steps.restore-sidecar.outputs.restored != 'true'
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install dependencies
        run: npm ci

      - name: Bundle extension
        run: npm run package:extension

      - name: Build sidecar
        if: steps.restore-sidecar.outputs.restored != 'true'
        run: node scripts/build-sidecar.js --target ${{ matrix.target }}

      - name: Stage sidecar
        if: steps.restore-sidecar.outputs.restored != 'true'
        run: node scripts/stage-sidecar.js --target ${{ matrix.target }}

      - name: Verify bundled sidecar
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node -e "const fs=require('fs'); const expected=process.env.TARGET.startsWith('win32-')?'R_CONSOLE_HOST.exe':'R_CONSOLE_HOST'; const dir='bundled/bin'; const files=fs.readdirSync(dir,{withFileTypes:true}).filter(e=>e.isFile()).map(e=>e.name).sort(); if(files.length!==1||files[0]!==expected){throw new Error('Expected exactly one bundled sidecar (' + expected + ') in ' + dir + '; found: ' + files.join(', '));} console.log(dir + '/' + files[0]);"

      - name: Package extension
        run: node scripts/package-vsix.js --target ${{ matrix.target }}

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vsc-r-console-*-${{ matrix.target }}.vsix
          if-no-files-found: error

  publish-development:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum *.vsix > SHA256SUMS.txt

      - name: Extract development release notes
        run: |
          awk '
            /^## Unreleased$/ { in_section = 1; next }
            /^## / && in_section { exit }
            in_section { print }
          ' CHANGELOG.md > unreleased-notes.md
          if ! grep -q '[^[:space:]]' unreleased-notes.md; then
            echo "::error::CHANGELOG.md does not contain a non-empty Unreleased section."
            exit 1
          fi
          {
            printf 'Development build from %s.\n\n' "$GITHUB_REF_NAME"
            cat unreleased-notes.md
          } > development-release-notes.md

      - name: Replace development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view development >/dev/null 2>&1; then
            gh release delete development --yes
          fi
          git tag --force development
          git push origin development --force

      - name: Publish development release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: development
          name: R Console Development Build
          body_path: development-release-notes.md
          prerelease: true
          make_latest: false
          files: |
            release-artifacts/*.vsix
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; const expected='v' + pkg.version; if(tag !== expected){throw new Error('Tag ' + tag + ' does not match package version ' + expected);}"

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum *.vsix > SHA256SUMS.txt

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          extract_section() {
            awk -v heading="$1" '
              /^##[[:space:]]+/ {
                current = $0
                sub(/^##[[:space:]]+/, "", current)
                sub(/[[:space:]]+-.*$/, "", current)
                sub(/^\[/, "", current)
                sub(/\]$/, "", current)
                if (current == heading) {
                  in_section = 1
                  next
                }
                if (in_section) {
                  exit
                }
              }
              in_section { print }
            ' CHANGELOG.md
          }
          extract_section "$version" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            extract_section "Unreleased" > release-notes.md
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md does not contain a section for ${version} or Unreleased."
            exit 1
          fi
          printf '\nFull changelog: https://github.com/%s/blob/%s/CHANGELOG.md\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: R Console ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/*.vsix
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true

  publish-marketplace:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_marketplace)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; const expected='v' + pkg.version; if(tag !== expected){throw new Error('Tag ' + tag + ' does not match package version ' + expected);}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: release-artifacts

      - name: Publish VS Code Marketplace
        run: npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }} --skip-duplicate --packagePath ./release-artifacts/*.vsix

  publish-open-vsx:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_open_vsx)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; const expected='v' + pkg.version; if(tag !== expected){throw new Error('Tag ' + tag + ' does not match package version ' + expected);}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: release-artifacts

      - name: Publish Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: npx --yes ovsx publish --skip-duplicate --packagePath ./release-artifacts/*.vsix
