name: Release VSIX
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: darwin-x64
            rust_target: x86_64-apple-darwin
          - os: macos-15
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            target: win32-x64
            rust_target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: win32-arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install dependencies
        run: npm ci

      - name: Bundle extension
        run: npm run package:extension

      - name: Build sidecar
        run: node scripts/build-sidecar.js --target ${{ matrix.target }}

      - name: Stage sidecar
        run: node scripts/stage-sidecar.js --target ${{ matrix.target }}

      - name: Package extension
        run: node scripts/package-vsix.js --target ${{ matrix.target }}

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vscode-r-console-*-${{ matrix.target }}.vsix
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; const expected='v' + pkg.version; if(tag !== expected){throw new Error('Tag ' + tag + ' does not match package version ' + expected);}"

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum *.vsix > SHA256SUMS.txt

      - name: Generate release notes
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pkg = require("./package.json");

          const tag = process.env.GITHUB_REF_NAME || "";
          const version = tag.startsWith("v") ? tag.slice(1) : pkg.version;
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const heading = changelog.match(
            new RegExp(`^## \\[${escapedVersion}\\][^\\n]*$`, "m")
          );

          if (!heading || heading.index === undefined) {
            throw new Error(`CHANGELOG.md does not contain a section for ${version}`);
          }

          const sectionStart = heading.index;
          const afterHeading = sectionStart + heading[0].length;
          const nextSectionOffset = changelog.slice(afterHeading).search(/\n## \[/);
          const sectionEnd =
            nextSectionOffset === -1
              ? changelog.length
              : afterHeading + nextSectionOffset;

          const releaseNotes = [
            changelog.slice(sectionStart, sectionEnd).trim(),
            "",
            `Full changelog: https://github.com/${process.env.GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md`,
            "",
          ].join("\n");

          fs.writeFileSync("release-notes.md", releaseNotes);
          NODE

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: R Console ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/*.vsix
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
