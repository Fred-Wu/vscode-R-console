name: Release VSIX
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish the built VSIX packages to the VS Code Marketplace
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: darwin-x64
            rust_target: x86_64-apple-darwin
          - os: macos-15
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            target: win32-x64
            rust_target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: win32-arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install dependencies
        run: npm ci

      - name: Bundle extension
        run: npm run package:extension

      - name: Build sidecar
        run: node scripts/build-sidecar.js --target ${{ matrix.target }}

      - name: Stage sidecar
        run: node scripts/stage-sidecar.js --target ${{ matrix.target }}

      - name: Package extension
        run: node scripts/package-vsix.js --target ${{ matrix.target }}

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vsc-r-console-*-${{ matrix.target }}.vsix
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; const expected='v' + pkg.version; if(tag !== expected){throw new Error('Tag ' + tag + ' does not match package version ' + expected);}"

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum *.vsix > SHA256SUMS.txt

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          extract_section() {
            awk -v heading="$1" '
              /^##[[:space:]]+/ {
                current = $0
                sub(/^##[[:space:]]+/, "", current)
                sub(/[[:space:]]+-.*$/, "", current)
                sub(/^\[/, "", current)
                sub(/\]$/, "", current)
                if (current == heading) {
                  in_section = 1
                  next
                }
                if (in_section) {
                  exit
                }
              }
              in_section { print }
            ' CHANGELOG.md
          }
          extract_section "$version" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            extract_section "Unreleased" > release-notes.md
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md does not contain a section for ${version} or Unreleased."
            exit 1
          fi
          printf '\nFull changelog: https://github.com/%s/blob/%s/CHANGELOG.md\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: R Console ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/*.vsix
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true

  publish-marketplace:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_marketplace)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; const expected='v' + pkg.version; if(tag !== expected){throw new Error('Tag ' + tag + ' does not match package version ' + expected);}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: release-artifacts

      - name: Publish VS Code Marketplace
        run: npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }} --skip-duplicate --packagePath ./release-artifacts/*.vsix
