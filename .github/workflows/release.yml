name: Package VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: darwin-x64
            rust_target: x86_64-apple-darwin
          - os: macos-15
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            target: win32-x64
            rust_target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: win32-arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install dependencies
        run: npm ci

      - name: Bundle extension
        run: npm run package:extension

      - name: Build sidecar
        run: node scripts/build-sidecar.js --target ${{ matrix.target }}

      - name: Stage sidecar
        run: node scripts/stage-sidecar.js --target ${{ matrix.target }}

      - name: Package extension
        run: node scripts/package-vsix.js --target ${{ matrix.target }} --output r-console-${{ matrix.target }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: r-console-${{ matrix.target }}-vsix
          path: r-console-${{ matrix.target }}.vsix
