name: CI

on:
  pull_request:
  push:
    # main and version tags run this workflow through release.yml.
    branches: [dev]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          rtools-version: none
      - run: npm ci
      - name: Audit npm dependencies
        if: runner.os == 'Linux'
        run: npm audit --audit-level=low
      - name: Type-check and bundle
        run: npm run package:extension
      - name: Unit tests
        run: npm test
      - name: Install Linux system dependency for R fs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev
      - name: Real R LSP authentication and protocol integration
        run: |
          Rscript -e "packages <- c('digest', 'languageserver'); repo <- Sys.getenv('RSPM'); if (!nzchar(repo)) repo <- 'https://cloud.r-project.org'; needed <- setdiff(packages, rownames(installed.packages())); if (length(needed)) install.packages(needed, repos = repo); stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))"
          node --test tests/lsp-startup.test.cjs tests/lsp-integration.test.cjs
      - name: Extension host smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension-host
      - name: Extension host smoke test
        if: runner.os != 'Linux'
        run: npm run test:extension-host
      - name: Rust tests
        run: cargo test --locked --manifest-path sidecar/pty-host/Cargo.toml
      - name: Build and stage runtime
        run: |
          npm run build:sidecar
          npm run stage:sidecar
      - name: Real R smoke test
        run: npm run test:runtime
      - name: Package and verify VSIX
        run: |
          npm run package:vsix
          npm run test:package
