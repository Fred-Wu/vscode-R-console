name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/release.yml'
  push:
    # main and version tags run this workflow through release.yml.
    branches: [dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # Use matching Rtools on Windows to compile the native safety fixture.
          rtools-version: ''
      - run: npm ci
      - name: Audit npm dependencies
        if: runner.os == 'Linux'
        run: npm run audit:dependencies
      - name: Build and stage runtime
        run: |
          npm run build:sidecar
          npm run stage:sidecar
      - name: Type-check and bundle
        run: npm run package:extension
      - name: Focused package monitoring and static completion regressions
        run: node --test tests/unit/package-inventory.test.cjs tests/unit/library-path-entry-monitor.test.cjs tests/unit/private-startup-windows-pipe.test.cjs tests/unit/static-bindings.test.cjs tests/unit/static-provider-edits.test.cjs tests/unit/static-provider-budget.test.cjs
      - name: Unit tests
        run: npm test
      - name: Install Linux system dependency for R fs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev
      - name: Install R completion test dependencies
        run: Rscript -e "packages <- c('digest', 'languageserver', 'magrittr', 'data.table', 'R6', 'S7'); repo <- Sys.getenv('RSPM'); if (!nzchar(repo)) repo <- 'https://cloud.r-project.org'; needed <- setdiff(packages, rownames(installed.packages())); if (length(needed)) install.packages(needed, repos = repo); stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))"
      - name: Real R language server startup, completion, and restart tests
        run: npm run test:lsp
      - name: Extension host activation and completion tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension-host
      - name: Extension host activation and completion tests
        if: runner.os != 'Linux'
        run: npm run test:extension-host
      - name: Native inspector R error/interrupt boundary test
        run: cargo test --locked --manifest-path sidecar/pty-host/Cargo.toml r_error_and_interrupt_jumps_are_caught_without_crossing_rust
      - name: Rust tests
        run: cargo test --locked --manifest-path sidecar/pty-host/Cargo.toml
      - name: Real R runtime, native callback safety, and frontend submission tests
        run: npm run test:runtime
      - name: Package and verify VSIX
        run: |
          npm run package:vsix
          npm run test:package
