name: Build Console Runtime

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - "sidecar/pty-host/**"
      - "package.json"
      - "scripts/build-sidecar.js"
      - "scripts/stage-sidecar.js"
      - "scripts/sidecar-targets.js"
      - ".github/workflows/build-sidecar.yml"
  pull_request:
    paths:
      - "sidecar/pty-host/**"
      - "package.json"
      - "scripts/build-sidecar.js"
      - "scripts/stage-sidecar.js"
      - "scripts/sidecar-targets.js"
      - ".github/workflows/build-sidecar.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            rust_target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: darwin-x64
            rust_target: x86_64-apple-darwin
          - os: macos-15
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
          - os: windows-11-arm
            target: win32-arm64
            rust_target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build sidecar
        run: node scripts/build-sidecar.js --target ${{ matrix.target }}

      - name: Stage sidecar
        run: node scripts/stage-sidecar.js --target ${{ matrix.target }}

      - name: Verify staged runtime
        run: |
          node -e "const fs=require('fs'); const path=require('path'); const expected=process.platform==='win32'?'R_CONSOLE_HOST.exe':'R_CONSOLE_HOST'; const dir='bundled/bin'; const files=fs.readdirSync(dir,{withFileTypes:true}).filter(e=>e.isFile()).map(e=>e.name).sort(); if(files.length!==1||files[0]!==expected){throw new Error(`Expected exactly one staged runtime (${expected}) in ${dir}; found: ${files.join(', ')}`)} console.log(path.join(dir, files[0]));"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: bundled/bin/
